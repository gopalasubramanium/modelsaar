name: site

# modelsaar.com checks. Every push/PR touching the site builds the production site, runs the static
# checks and keeps the output as a workflow artifact. Publishing is NOT done by this workflow: the site is
# published by pushing the generated-output branch `gh-pages` (made by `site/publish_pages.py`), which
# GitHub Pages serves directly ("deploy from a branch"). That keeps publication independent of
# workflow_dispatch, which GitHub only offers for workflows that exist on the default branch.
on:
  push:
    branches: [website/modelsaar-com, main]
    paths: [site/**, docs/**, README.md, CHANGELOG.md, CONTRIBUTING.md, SECURITY.md, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, .github/workflows/site.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install (the site reads docs and the CLI from the repository)
        run: python -m pip install -e '.[dev]' markdown
      - name: Build (production)
        run: python site/build.py
      - name: Static checks (links, headings, metadata, sitemap, installer pin, CLI commands)
        run: python site/check_site.py
      - name: Installer syntax; pinned revision must be public on origin
        run: |
          sh -n site/dist/install.sh
          SHA=$(sed -n 's/^REF="${MODELSAAR_REF:-\([0-9a-f]*\)}"/\1/p' site/dist/install.sh)
          git fetch --depth=1 origin "$SHA" && echo "pinned $SHA is reachable on origin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-dist-${{ github.sha }}
          path: site/dist
