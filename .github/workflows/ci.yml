name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check src tests
      - name: Isolation backend for the code-exec tests (bubblewrap; Docker image as fallback)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          docker pull -q python:3.12-slim || true
          python -c "from modelsaar.evaluation import sandbox; b, why = sandbox.available(); print(b, '-', why); raise SystemExit(0 if b else 1)"
      - name: Unit, contract and fault-injection tests (fixture backends only; no model downloads)
        run: pytest -q -rs -m "not live"
      - name: Simulated evaluation smoke
        run: modelsaar eval --mode simulated --limit 12 --out eval-sim.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-sim-${{ matrix.python }}
          path: eval-sim.json

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dependency audit (runtime dependencies as declared in pyproject.toml)
        run: |
          pip install pip-audit
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/runtime-requirements.txt
          pip-audit --strict --desc -r /tmp/runtime-requirements.txt
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image locally (not pushed)
        run: docker build -t modelsaar:ci .
      - name: Smoke the CLI inside the image
        run: docker run --rm modelsaar:ci modelsaar --version
      - name: Fresh-volume start (Compose-equivalent; keys bootstrapped once, read-only config, non-root)
        run: scripts/compose-smoke.sh modelsaar:ci

  # The one-line installer on an OS whose Python is externally managed (PEP 668), x86_64 and ARM64. Real
  # package installations from the pinned commit's GitHub archive; the routed request goes to the repository's
  # controlled fake backend (not a real model). Cases: original failure reproduced with the previous installer,
  # user-owned venv on the OS interpreter, venv/ensurepip unavailable -> pinned checksum-verified uv, existing
  # uv and pipx paths, repeat/failed-attempt preservation, exit codes. Nothing is installed into the OS Python.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # case 7 installs the pinned commit from this clone (git+file) and from the archive
      - name: Harness dependencies (a separate venv; the OS Python under test is untouched)
        run: |
          python3 -m venv ~/harness && ~/harness/bin/pip install -q -e . && ~/harness/bin/pip install -q starlette uvicorn
          ls -l /usr/lib/python3.12/EXTERNALLY-MANAGED
      - name: The pinned uv for the existing-uv case (same URL and checksum the installer uses)
        run: |
          UVV=$(sed -n 's/^UV_VERSION="\(.*\)"/\1/p' site/static/install.sh)
          T="$(uname -m)-unknown-linux-gnu"
          curl -fsSL -o /tmp/uv.tgz "https://github.com/astral-sh/uv/releases/download/$UVV/uv-$T.tar.gz"
          WANT=$(sed -n "s/^ *$T) *echo \([0-9a-f]*\).*/\1/p" site/static/install.sh); echo "$WANT  /tmp/uv.tgz" | sha256sum -c -
          tar -xzf /tmp/uv.tgz -C /tmp && cp /tmp/uv-$T/uv /tmp/uv-pinned && /tmp/uv-pinned --version
      - name: Cases 1, 2, 4, 5, 6, 7 (externally managed /usr/bin/python3.12; no uv/pipx/git on the installer's PATH unless the case provides them)
        run: |
          # GitHub's runner image ships a pip configuration that sets break-system-packages=true, which a stock
          # Debian/Ubuntu does not have; the OS default (PEP 668 enforced) is restored for the installer under test.
          echo "--- runner pip config:"; python3 -m pip config list -v 2>/dev/null | head -20; cat /etc/pip.conf 2>/dev/null || true
          export PIP_CONFIG_FILE=/dev/null
          REF=$(sed -n 's/^INSTALL_SHA = "\([0-9a-f]*\)".*/\1/p' site/facts.py)
          ~/harness/bin/python scripts/installer_fallback_tests.py --ref "$REF" --managed-python /usr/bin/python3.12 \
            --old-install scripts/fixtures/install-2026-10-12-pip-user.sh --uv-binary /tmp/uv-pinned --repo "$PWD" --cases 1,2,4,5,7 --out installer-cases-${{ matrix.os }}
      - name: Case 3 — the OS venv package removed (python3 -m venv then fails for lack of ensurepip, as on a minimal Debian/Ubuntu); no git
        run: |
          sudo apt-get remove -y -qq python3.12-venv python3-venv >/dev/null
          (python3.12 -m venv /tmp/should-fail && echo "unexpected: venv still works" && exit 1) || true
          export PIP_CONFIG_FILE=/dev/null
          REF=$(sed -n 's/^INSTALL_SHA = "\([0-9a-f]*\)".*/\1/p' site/facts.py)
          ~/harness/bin/python scripts/installer_fallback_tests.py --ref "$REF" --managed-python /usr/bin/python3.12 \
            --no-ensurepip-python /usr/bin/python3.12 --cases 3 --out installer-case3-${{ matrix.os }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: installer-cases-${{ matrix.os }}
          path: installer-case*-${{ matrix.os }}
