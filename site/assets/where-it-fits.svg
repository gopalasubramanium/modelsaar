<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Helvetica Neue, Arial, Liberation Sans, sans-serif" font-size="18">
  <title id="t">Where ModelSaar fits</title>
  <desc id="d">Apps on the left send OpenAI-compatible requests for the model "auto" to ModelSaar in the middle, which reads the request's requirements, crosses out deployments that cannot do the job, ranks the rest on evidence, routes the request to the winner while preserving conversation continuity, and records the decision without the prompt. The inference backends on the right (Ollama, vLLM, llama.cpp server) keep the model weights, licences and hardware; ModelSaar never downloads a model.</desc>
  <!-- Geometry note: this file is viewed as an external image, so the page's web font does not apply; the fallback
       sans fonts (Helvetica/Arial/Liberation) are wider than IBM Plex. Every label below leaves >= 24 px of room
       against its box at Liberation Sans metrics (site/browser_checks.py measures the rendered text boxes). -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#55635f"/></marker></defs>
  <!-- apps -->
  <text x="40" y="52" font-size="15" fill="#55635f">Apps you already use</text>
  <g fill="#f1f3ef" stroke="#d6dcd6">
    <rect x="40" y="70" width="220" height="56" rx="6"/><rect x="40" y="142" width="220" height="56" rx="6"/><rect x="40" y="214" width="220" height="56" rx="6"/><rect x="40" y="286" width="220" height="56" rx="6"/>
  </g>
  <g fill="#16211f">
    <text x="60" y="104">Open WebUI</text><text x="60" y="176">OpenCode · OpenClaw</text><text x="60" y="248">Hermes Agent</text><text x="60" y="320" font-size="17">Your scripts and SDKs</text>
  </g>
  <!-- arrows apps -> gateway -->
  <g stroke="#55635f" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M262 98 C 320 98, 320 206, 376 206"/><path d="M262 170 C 320 170, 320 206, 376 206"/><path d="M262 242 C 320 242, 320 206, 376 206"/><path d="M262 314 C 320 314, 320 206, 376 206"/>
  </g>
  <text x="262" y="52" font-size="14" fill="#55635f">one address · model: auto</text>
  <!-- gateway -->
  <rect x="380" y="70" width="360" height="300" rx="8" fill="#0f5c50"/>
  <text x="404" y="106" font-size="22" font-weight="600" fill="#fff">ModelSaar</text>
  <text x="404" y="128" font-size="14" fill="#cfe6df">OpenAI-compatible gateway</text>
  <text x="404" y="146" font-size="14" fill="#cfe6df">on your machine</text>
  <g fill="#fff" font-size="16">
    <text x="404" y="184">1 · read the request's requirements</text>
    <text x="404" y="214">2 · cross out what cannot do the job</text>
    <text x="404" y="244">3 · rank the rest on evidence</text>
    <text x="404" y="274">4 · route it; preserve continuity</text>
    <text x="404" y="304">5 · record the decision (no prompt)</text>
  </g>
  <rect x="404" y="322" width="312" height="26" rx="4" fill="#f0b84a"/>
  <text x="414" y="340" font-size="14" fill="#1a1400">X-ModelSaar-Deployment: ollama/…</text>
  <!-- arrows gateway -> backends -->
  <g stroke="#55635f" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M742 206 C 780 206, 780 112, 816 112"/><path d="M742 206 C 780 206, 780 224, 816 224"/>
  </g>
  <!-- backends -->
  <text x="820" y="52" font-size="15" fill="#55635f">Inference backends you run</text>
  <g fill="#f1f3ef" stroke="#d6dcd6"><rect x="820" y="80" width="240" height="64" rx="6"/><rect x="820" y="192" width="240" height="64" rx="6"/></g>
  <g fill="#16211f"><text x="840" y="106">Ollama</text><text x="840" y="128" font-size="14" fill="#55635f">your pulled models</text>
  <text x="840" y="218" font-size="17">vLLM · llama.cpp server</text><text x="840" y="240" font-size="14" fill="#55635f">declared models</text></g>
  <text x="820" y="300" font-size="14" fill="#55635f">Weights, licences and hardware</text>
  <text x="820" y="320" font-size="14" fill="#55635f">stay here. ModelSaar never</text>
  <text x="820" y="340" font-size="14" fill="#55635f">downloads a model.</text>
  <text x="40" y="412" font-size="14" fill="#55635f">Decision records: modelsaar decisions · modelsaar explain · /admin/ui</text>
</svg>
