# Every entry was checked against primary sources on 2026-10-11 (model cards, publisher
# posts, ollama.com library pages); see docs/catalogue.md for the per-entry evidence.
#
# What this file does:  supplies *priors* (labelled "catalogue"), tags, roles and
# intended-use notes for deployments whose names match `match`. It never asserts a
# capability as locally verified. Capability truth comes from the runtime's own
# metadata (e.g. Ollama /api/show), operator overrides, and `modelsaar probe`.
#
# availability: released_weights | announced_weights | api_only | unverified
# Only released_weights entries with enabled_by_default: true contribute defaults.
# quality_prior values are coarse hypotheses (0..1), NOT local measurements.
